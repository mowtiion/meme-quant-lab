name: Bounded historical token-state probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read bounded historical state
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python scripts/probe_token_state.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-token-state
          path: data/secondary/token-state/
          retention-days: 30
